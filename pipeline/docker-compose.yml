# Module 23 §5: Docker & Compose rules.
# - images pinned to exact tags; no `latest`
# - host ports bound to 127.0.0.1 only
# - mem_limit per service, total ~4 GB
# - named volume for the lake; the repo is mounted read-only, never writeable
# - no secrets: this pipeline needs none
# - restart: "no" everywhere: a demo that dies stays dead and visible rather
#   than silently looping (§4 Module 54)

name: urbanflow

services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: urbanflow-kafka
    mem_limit: 1g
    restart: "no"
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      # Two listeners: the host reaches 127.0.0.1:9092, containers reach
      # kafka:29092. Advertising only 127.0.0.1 would hand Spark a loopback
      # address it cannot route to.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092,INTERNAL://kafka:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 10

  spark:
    build: ./docker/spark
    container_name: urbanflow-spark
    user: "10001"
    depends_on:
      kafka:
        condition: service_healthy
    mem_limit: 2g
    restart: "no"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - LAKE_STORAGE_PATH=/data/lake
      - SPARK_SHUFFLE_PARTITIONS=6
      # Optional analytics mirror (ADR-0008 keeps Parquet authoritative). Unset
      # => disabled and the default quickstart is unchanged. Point MONGO_URI at a
      # host MongoDB (the default Windows/local install) via host.docker.internal,
      # or at the `mongo` profile below with MONGO_URI=mongodb://mongo:27017.
      - MONGO_URI=${MONGO_URI:-}
      - MONGO_DB=${MONGO_DB:-urbanflow}
    # Docker Desktop provides host.docker.internal; host-gateway makes the same
    # name resolve on Linux engines so a host-run mongod is reachable either way.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Named volume: the lake survives `docker compose down`, and is removed
      # only by `make clean`.
      - lake:/data
      # Read-only: a container that cannot write the repo cannot smuggle code
      # into the next build.
      - ./spark:/app:ro
    working_dir: /app
    # Module 23 §5: healthcheck on a log marker. The job rewrites
    # /data/lake/_health/stream.json after every micro-batch, so "stale file"
    # means "query stopped consuming" — not "container is up".
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,sys,time; h=json.load(open('/data/lake/_health/stream.json')); sys.exit(0 if time.time()*1000-h['updatedAtMs'] < 120000 else 1)",
        ]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3

# Module 23 §5: profiles — default = Parquet on the named volume above.
# `s3` and `hdfs` are opt-in lake targets (`docker compose --profile s3 up`);
# they stay inert otherwise, so the default quickstart is unchanged and no
# extra memory is committed. Pinned tags, loopback ports, mem limits like every
# other service here.

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: ["s3"]
    container_name: urbanflow-minio
    user: "10001"
    mem_limit: 512m
    restart: "no"
    ports:
      - "127.0.0.1:9000:9000"
    command: server /data
    environment:
      # Demo credentials only — Module 23 §5: no real secrets in images or
      # compose; a production lake target would pass them at runtime.
      MINIO_ROOT_USER: urbanflow
      MINIO_ROOT_PASSWORD: urbanflow-demo
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 10s
      retries: 5
    volumes:
      - lake-s3:/data

  hdfs:
    image: apache/hadoop:3.4.1
    profiles: ["hdfs"]
    container_name: urbanflow-hdfs
    mem_limit: 1g
    restart: "no"
    ports:
      - "127.0.0.1:9870:9870"
    environment:
      - ENSURE_SITE_fs.defaultFS=http://hdfs:8020
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9870 || exit 1"]
      interval: 15s
      retries: 5
    volumes:
      - lake-hdfs:/opt/hadoop/data

  # Optional analytics store. Off by default (profile), so the quickstart needs
  # no MongoDB. Enable with `docker compose --profile mongo up` and set
  # MONGO_URI=mongodb://mongo:27017 for the spark service. This is the Docker
  # alternative to a local install (see docs/runbooks/07-local-mongodb.md); if
  # you run mongod on the host you do NOT need this profile.
  mongo:
    image: mongo:7.0.14
    profiles: ["mongo"]
    container_name: urbanflow-mongo
    mem_limit: 512m
    restart: "no"
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - mongo:/data/db

volumes:
  lake:
    name: urbanflow-lake
  lake-s3:
    name: urbanflow-lake-s3
  lake-hdfs:
    name: urbanflow-lake-hdfs
  mongo:
    name: urbanflow-mongo
