name: ci
on:
  push:
    branches: [main, build/**]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # Module 34 §2/§5: CI and local use the same Node, read from .nvmrc
          # rather than a version duplicated in the workflow.
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Python test requirements
        # numpy powers the Module 23 §4 EWMA reference test.
        run: pip install pytest pydantic numpy
      - name: Verify workspace (typecheck + test + docs + build + meta + fitness)
        run: pnpm verify
      - name: Security checks (bundle-secret grep, headers, single-writer)
        # Module 34 §3/§5: `pnpm security` is a named CI gate, not only local.
        run: pnpm security
      - name: Grep audits (Module 62 §3, Module 61 §1)
        # helpers/audit.sh A1–A14. Wired non-blocking first because the
        # AUDIT-OK() exceptions added on 2026-10-31 have not had the required
        # human review yet, and the script itself has never run in this
        # environment (docs/LIMITATIONS.md #35). Flip `continue-on-error` to
        # absent once a human has reviewed the markers and seen a clean local
        # run — Module 61 §1 intends this to be a hard gate.
        run: bash helpers/audit.sh
        continue-on-error: true
      - name: Run PySpark unit tests
        run: |
          export PYTHONPATH="pipeline/spark:$PYTHONPATH"
          pytest pipeline/spark/tests
      - name: pip-audit (Module 52 §1, non-blocking)
        # Module 52 §1 requires pip-audit in CI. Non-blocking for the same
        # reason as the grep audits (LIMITATIONS #35): it has never run here,
        # and an unexpected advisory must not freeze an otherwise-green verify.
        # `--no-deps` audits only the explicitly pinned files, which is the
        # supply-chain question the module asks (Rule 18: pinned, auditable).
        run: |
          pip install pip-audit
          pip-audit -r pipeline/docker/spark/requirements.txt --no-deps
          pip-audit -r pipeline/requirements-dev.txt --no-deps
        continue-on-error: true
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            packages/bench/out/
            docs/

  # Module 14 §4.1: gitleaks in CI. Free for public repositories; a private
  # repository additionally needs a GITLEAKS_LICENSE secret.
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan history for committed credentials
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

