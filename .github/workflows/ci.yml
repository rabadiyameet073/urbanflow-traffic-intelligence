name: ci
on:
  push:
    branches: [main, build/**]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Python test requirements
        run: pip install pytest pydantic
      - name: Verify workspace (typecheck + test + build)
        run: pnpm verify
      - name: Run PySpark unit tests
        run: |
          export PYTHONPATH="pipeline/spark:$PYTHONPATH"
          pytest pipeline/spark/tests
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            packages/bench/out/
            docs/
