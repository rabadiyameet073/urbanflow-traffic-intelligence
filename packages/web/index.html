<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />

    <title>UrbanFlow AI – Adaptive Signals & Emergency Preemption</title>
    <meta name="description" content="Open-source traffic-signal simulation: adaptive control vs fixed-time on identical arrivals, safe emergency preemption and a guarded Meta AI copilot." />
    <!-- Self-hosted flat SVG favicon (Module 33 §2): no CDN, no emoji, no gradient. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Canonical and social URLs must match the Pages project name in
         docs/runbooks/DEPLOY.md and ALLOWED_ORIGINS in wrangler.toml. -->
    <link rel="canonical" href="https://urbanflow-ai.pages.dev/" />
    <meta name="theme-color" content="#0B0F14" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F6F8FA" media="(prefers-color-scheme: light)" />
    <!-- Edge gateway base URL; empty means same-origin (Module 22 §2). -->
    <meta name="urbanflow-api-base" content="" />

    <!-- Open Graph & Social Cards (Module 33 §2) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="UrbanFlow AI" />
    <meta property="og:description" content="Adaptive traffic control with safe emergency preemption. Simulation, not real roads." />
    <meta property="og:url" content="https://urbanflow-ai.pages.dev/" />
    <meta property="og:image" content="https://urbanflow-ai.pages.dev/og.png" />
    <meta property="og:image:alt" content="Twin view of two intersections: fixed-time versus adaptive control." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="UrbanFlow AI" />
    <meta name="twitter:image" content="https://urbanflow-ai.pages.dev/og.png" />

    <!-- Preload fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <link rel="stylesheet" href="/src/styles/base.css" />
    <link rel="stylesheet" href="/src/styles/components.css" />
    <link rel="stylesheet" href="/src/styles/system.css" />

    <!-- Structured Data (JSON-LD, XSS-safe escaped) (Module 33 §3) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "UrbanFlow AI",
      "applicationCategory": "SimulationApplication",
      "operatingSystem": "Web",
      "description": "Traffic-signal simulation with adaptive control, emergency preemption and an AI copilot.",

      "license": "https://opensource.org/license/mit"
