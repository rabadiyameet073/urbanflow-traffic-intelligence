<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="UrbanFlow AI">
  <!--
    Self-hosted, flat favicon (Module 33 §2 / Module 51). No gradient, no emoji —
    a four-way junction drawn with the app's own line-icon grammar, filled with
    the design tokens: --color-canvas (#0B0F14), --color-accent (#56B4E9) and
    --color-go (#2FD4A0) for the green phase node at the centre. Kept to two
    crossed bars and a dot so it stays legible at 16 px.
  -->
  <rect width="64" height="64" rx="14" fill="#0B0F14" />
  <path d="M32 11v42" stroke="#56B4E9" stroke-width="7" stroke-linecap="round" />
  <path d="M11 32h42" stroke="#56B4E9" stroke-width="7" stroke-linecap="round" />
  <circle cx="32" cy="32" r="7.5" fill="#0B0F14" />
  <circle cx="32" cy="32" r="3.6" fill="#2FD4A0" />
</svg>
