name = "urbanflow-edge"
main = "src/index.ts"
compatibility_date = "2026-10-27"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[vars]
# Must match the Pages project name in docs/runbooks/DEPLOY.md; a mismatch makes the
# browser preflight fail with 403 ORIGIN_FORBIDDEN.
ALLOWED_ORIGINS = "https://urbanflow-ai.pages.dev,http://localhost:5173"
AI_DAILY_CAP = "1500"
META_MODEL = "muse-spark-1.3"
META_API_BASE = "https://api.dev.meta.ai/v1"

